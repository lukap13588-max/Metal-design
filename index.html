<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METAL DESIGN 3D</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e8eef7;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #28364a;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}small,.muted{color:#9bacc1}main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 67px)}aside{padding:22px;background:#121d2d;border-right:1px solid #28364a;overflow:auto}h2{font-size:16px;margin:0 0 20px}label{display:block;margin:16px 0 7px;color:#bac8d8;font-size:13px}input,select,button{width:100%;border:1px solid #34445a;background:#1b2b40;color:#fff;padding:12px;border-radius:9px;font:inherit}input:focus,select:focus{outline:2px solid #4c9aff}button{background:#2476e8;border:0;cursor:pointer;font-weight:650;margin-top:12px}button.secondary{background:#243750}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view{position:relative;min-height:560px}#scene{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:20px;bottom:20px;background:#111c2bd9;border:1px solid #324358;border-radius:9px;padding:10px 14px;font-size:12px;color:#c1cddd;pointer-events:none}.tag{font-size:12px;background:#1d3b5c;padding:7px 11px;border-radius:7px}.summary{margin-top:20px;padding:14px;border:1px solid #35465d;border-radius:10px;font-size:13px;line-height:1.9}.error{color:#ffb5b5}.topright{display:flex;gap:8px;align-items:center}@media(max-width:780px){main{grid-template-columns:1fr}aside{order:2}.view{height:52vh;min-height:360px}header{padding:14px}h1{font-size:17px}}
</style></head><body><header><div><h1>METAL DESIGN <span style="color:#65aaff">3D</span></h1><small>Geländerkonfigurator · Prototyp 1.2</small></div><span class="tag">LIVE 3D</span></header><main><aside><h2>Geländer konfigurieren</h2><label for="project">Projekt / Kunde</label><input id="project" type="text" value="Balkongeländer Musterprojekt" maxlength="80"><label for="type">Geländertyp</label><select id="type"><option value="vertical">Senkrechte Füllstäbe</option><option value="horizontal">Waagrechte Füllstäbe</option><option value="glass">Glasfüllung</option></select><div class="pair"><div><label for="length">Länge (mm)</label><input id="length" type="number" min="500" max="12000" step="100" value="4000"></div><div><label for="height">Höhe (mm)</label><input id="height" type="number" min="700" max="1600" step="50" value="1000"></div></div><div class="pair"><div><label for="spacing">Pfostenabstand max. (mm)</label><input id="spacing" type="number" min="400" max="2500" step="50" value="1000"></div><div><label for="material">Material</label><select id="material"><option value="steel">Stahl</option><option value="stainless">Edelstahl</option><option value="aluminum">Aluminium</option></select></div></div><label for="color">Farbe / Oberfläche</label><select id="color"><option value="7016">RAL 7016 – Anthrazit</option><option value="9005">RAL 9005 – Schwarz</option><option value="9016">RAL 9016 – Weiß</option><option value="7035">RAL 7035 – Lichtgrau</option><option value="inox">Edelstahloptik</option></select><label for="mount">Befestigung</label><select id="mount"><option value="top">Aufgesetzt mit Fußplatten</option><option value="side">Seitlich mit Wandplatten</option></select><label for="rail">Handlauf</label><select id="rail"><option value="square">Rechteckprofil</option><option value="round">Rundrohr</option></select><div class="summary" id="summary"></div><button id="fit">Gesamtes Geländer anzeigen</button><button class="secondary" id="front">Vorderansicht</button><button class="secondary" id="reset">Perspektivansicht</button><button class="secondary" id="save">PNG der 3D-Ansicht speichern</button><button class="secondary" id="config">Konfiguration als JSON speichern</button><p class="muted" style="font-size:12px;line-height:1.6">Visualisierung für Kundengespräche, keine statische Berechnung oder Fertigungsfreigabe. Profilabmessungen sind beispielhaft.</p><div id="status" class="error" role="status"></div></aside><section class="view"><canvas id="scene" aria-label="Interaktive 3D-Ansicht des Geländers"></canvas><div class="hint">Ziehen: drehen · Mausrad / Zwei Finger: zoomen · Rechtsklick: verschieben</div></section></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),canvas=$('scene');let renderer,scene,camera,controls,group;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x17283c);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,1,.05,100);camera.position.set(5,3.1,6.5);controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=1.5;controls.maxDistance=35;controls.maxPolarAngle=Math.PI/2-.03;scene.add(new THREE.HemisphereLight(0xdceaff,0x374252,2.1));let sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-3,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);let floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x19283b,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.055;floor.receiveShadow=true;scene.add(floor);let grid=new THREE.GridHelper(30,30,0x536780,0x31445c);grid.position.y=-.05;scene.add(grid);group=new THREE.Group();scene.add(group);}catch(e){$('status').textContent='3D konnte nicht gestartet werden: '+e.message;throw e}
function box(w,h,d,x,y,z,mat){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}function cyl(r,len,x,y,z,mat,rot=0){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12),mat);m.position.set(x,y,z);m.rotation.z=rot;m.castShadow=true;group.add(m);return m}function value(id,lo,hi){let n=Number($(id).value);return Math.min(hi,Math.max(lo,Number.isFinite(n)?n:lo))}
function build(){while(group.children.length){const child=group.children[0];group.remove(child);child.geometry?.dispose();} let L=value('length',500,12000)/1000,H=value('height',700,1600)/1000,S=value('spacing',400,2500)/1000;let segments=Math.ceil(L/S),actual=L/segments;let colors={'7016':0x383e47,'9005':0x101215,'9016':0xe5e8ed,'7035':0xb7bec5,'inox':0xa9b5c2};let metal=new THREE.MeshStandardMaterial({color:colors[$('color').value],metalness:$('material').value==='steel'?.68:.85,roughness:$('color').value==='inox'?.23:.36});let glass=new THREE.MeshPhysicalMaterial({color:0x9dc6d4,transparent:true,opacity:.32,roughness:.08,metalness:0,side:THREE.DoubleSide,depthWrite:false});let post=.045,hand=.05;for(let i=0;i<=segments;i++){let x=i*actual-L/2;box(post,H,post,x,H/2,0,metal);($('mount').value==='top'?box(.14,.014,.14,x,.007,0,metal):box(.014,.14,.14,x,.12,-.065,metal))}if($('rail').value==='round'){cyl(.028,L,0,H,0,metal,Math.PI/2)}else box(L+.065,hand,.065,0,H,0,metal);let type=$('type').value;for(let i=0;i<segments;i++){let left=i*actual-L/2,right=(i+1)*actual-L/2,inner=actual-post;if(type==='vertical'){box(inner,.025,.025,(left+right)/2,.16,0,metal);let count=Math.max(1,Math.ceil(inner/.11)-1);for(let j=1;j<=count;j++){let x=left+post/2+j*inner/(count+1);box(.018,H-.24,.018,x,H/2+.025,0,metal)}}else if(type==='horizontal'){for(let j=1;j<=5;j++)box(inner,.018,.018,(left+right)/2,j*(H-.13)/6+.055,0,metal)}else{box(inner-.035,H-.2,.012,(left+right)/2,H/2+.01,0,glass);box(inner,.025,.03,(left+right)/2,.13,0,metal)}}$('summary').innerHTML=`<strong>${$('project').value.replaceAll('<','&lt;').replaceAll('>','&gt;') || 'Projektübersicht'}</strong><br>Länge: ${Math.round(L*1000)} mm<br>Höhe: ${Math.round(H*1000)} mm<br>Pfosten: ${segments+1} Stück<br>Tatsächlicher Pfostenabstand: ${Math.round(actual*1000)} mm<br>Felder: ${segments} Stück<br>Befestigung: ${$('mount').value==='top'?'aufgesetzt':'seitlich'}<br><small>Maße sind Planungswerte, keine statische Prüfung.</small>`;controls.target.set(0,H*.52,0);controls.update()}
['type','length','height','spacing','material','color','rail','mount','project'].forEach(id=>$(id).addEventListener('input',build));function fitView(front=false){
const L=value('length',500,12000)/1000,H=value('height',700,1600)/1000;
const distance=Math.max(3.2,L*1.45,H*3.2);
camera.position.set(front?0:distance*.48,front?H*.5:distance*.48,distance);
controls.target.set(0,H*.5,0);controls.update();
}
$('fit').onclick=()=>fitView(false);
$('front').onclick=()=>fitView(true);
function resize(){let w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}$('reset').onclick=()=>{fitView(false)};$('save').onclick=()=>{renderer.render(scene,camera);let a=document.createElement('a');a.download='metal-design-3d-gelaender.png';a.href=canvas.toDataURL('image/png');a.click()};$('config').onclick=()=>{let data={application:'METAL DESIGN 3D',version:'1.2',project:$('project').value,mount:$('mount').value,type:$('type').value,length_mm:value('length',500,12000),height_mm:value('height',700,1600),max_post_spacing_mm:value('spacing',400,2500),material:$('material').value,color:$('color').value,handrail:$('rail').value};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gelaender-konfiguration.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};build();fitView(false);resize();loop();
</script></body></html>
